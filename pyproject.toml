[build-system]
requires = ["setuptools==84.0.0", "wheel==0.48.0"]
build-backend = "setuptools.build_meta"

[project]
name = "life-load"
version = "0.1.2"
description = "Experimental personal load reflection and scoring prototype."
requires-python = ">=3.11"
dependencies = ["cryptography==46.0.7"]

[project.optional-dependencies]
object-store = ["boto3"]
garmin = ["garminconnect"]
dev = [
  "pytest>=8",
]
postgres = [
  "psycopg[binary]>=3.2,<4",
]

[tool.setuptools.package-data]
life_load = ["*.json"]

[tool.setuptools]
package-dir = {"" = "app/backend"}

[tool.setuptools.packages.find]
where = ["app/backend"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["app/backend", "."]
